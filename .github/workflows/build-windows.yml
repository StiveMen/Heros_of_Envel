name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    paths:
      - "game.py"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Envel2D game.py
      - uses: actions/upload-artifact@v4
        with:
          name: Envel2D-Windows
          path: dist/Envel2D.exe
